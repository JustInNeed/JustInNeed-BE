# EC2 운영 실행용 compose (로컬 개발용은 루트 docker-compose.yml)
# CI 가 배포 때마다 이 파일을 EC2 로 복사하고 API_IMAGE 를 커밋 SHA 태그로 넣어 실행한다.
# 수동 실행: API_IMAGE=<도커허브 아이디>/justinneed-be:latest docker compose -f docker-compose.yml up -d
services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: justinneed-be
    restart: unless-stopped
    # 운영 값(DB, JWT, OAuth 키, FE 도메인)은 서버에만 두고 레포에는 올리지 않는다
    env_file: /etc/justinneed/prod.env
    # 외부 노출은 Nginx(HTTPS) 가 담당하므로 127.0.0.1 에만 바인딩한다
    ports:
      - "127.0.0.1:8080:8080"
    # AI 분석 컨테이너(justinneed-ai)와 같은 네트워크. Spring 이 http://justinneed-ai:8000 으로 호출한다
    networks:
      - justinneed-net

# AI 레포 compose 와 같이 쓰는 네트워크. 배포 스크립트가 없으면 만든다
networks:
  justinneed-net:
    external: true
