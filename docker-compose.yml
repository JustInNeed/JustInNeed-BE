services:
  postgres:
    image: postgres:17
    container_name: justinneed-postgres
    restart: unless-stopped
    ports:
      # 맥(호스트) ${POSTGRES_HOST_PORT} → 컨테이너 5432. 네이티브 5432와 충돌 회피
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - justinneed-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: justinneed-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - justinneed-pgadmin-data:/var/lib/pgadmin
      # 최초 기동 시 postgres 서버 자동 등록 (비밀번호만 최초 1회 입력)
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  justinneed-postgres-data:
  justinneed-pgadmin-data:
