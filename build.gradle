plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.justinneed'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// 정책 #13: 포맷은 google-java-format AOSP (공백 4칸 · 줄 100자). 고치기: ./gradlew spotlessApply
spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.28.0').aosp().reflowLongStrings(false)
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// 정책 #17: 버그로 이어지는 최소 규칙만, 하나라도 걸리면 실패. 포맷(줄 길이 · 들여쓰기)은 Spotless 가 맡는다
checkstyle {
	toolVersion = '10.26.1'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
	ignoreFailures = false
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	// 테스트 전용 인메모리 DB (운영 코드에서는 사용하지 않음)
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 운영과 같은 KST 기준으로 테스트 (CI 서버가 UTC 여도 동일하게)
	jvmArgs '-Duser.timezone=Asia/Seoul'
	// OpenApiSpecTest 가 레포 루트 openapi.json 을 읽는다. 파일만 바뀌어도 테스트가 다시 돌게 입력으로 등록한다
	inputs.files('openapi.json').withPropertyName('openapiSpec')
	inputs.property('updateOpenapi', System.getenv('UPDATE_OPENAPI') ?: '')
}

// 로컬 실행(bootRun) 시 .env 파일을 읽어 환경변수로 주입한다.
// (Spring 이 ${KAKAO_CLIENT_ID} 등을 OS 환경변수에서 해석 → OAuth 클라이언트 정보 주입)
tasks.named('bootRun') {
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			def trimmed = line.trim()
			if (!trimmed.isEmpty() && !trimmed.startsWith('#') && trimmed.contains('=')) {
				def idx = trimmed.indexOf('=')
				def key = trimmed.substring(0, idx).trim()
				def value = trimmed.substring(idx + 1).trim()
				environment key, value
			}
		}
	}
}
