# 운영 프로파일(SPRING_PROFILES_ACTIVE=prod): 메인 application.yml 위에 덮어쓴다.
# 운영 값은 전부 서버 환경변수로 주입하며, 기본값을 두지 않아 미설정 시 기동이 실패한다.
spring:
  # Supabase 는 세션 모드 풀러(5432)로 연결 (트랜잭션 모드 6543 은 Hibernate prepared statement 와 충돌)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway 도입 전까지는 update 유지 (도입 후 validate 로 전환)
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

server:
  # Nginx(HTTPS) 뒤에서 X-Forwarded-* 를 반영 → OAuth redirect-uri 의 {baseUrl} 이 https:// 로 잡힌다
  forward-headers-strategy: framework

# 헬스체크용 health 만 노출하고 상세(DB 상태 등)는 숨긴다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
  oauth:
    success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI}
    failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT_URI}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
