spring:
  application:
    name: just-in-need-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/justinneed}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID}
            # Spring 표준 템플릿 → http://localhost:8080/login/oauth2/code/kakao 로 해석 (.env의 KAKAO_REDIRECT_URI와 동일)
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: none   # 카카오 client secret 미사용
            scope:
              - profile_nickname
          naver:
            client-name: Naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  servlet:
    context-path: /

# 애플리케이션 커스텀 설정 (JWT / OAuth 성공 리다이렉트)
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-please-change-in-prod-0123456789abcdef}
    access-token-validity-seconds: 3600        # 1시간
    refresh-token-validity-seconds: 1209600    # 14일
  oauth:
    success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth/callback}
