spring:
  application:
    name: just-in-need-backend
  # JSON 응답에도 charset=UTF-8 을 붙인다 (없으면 Safari 가 로케일 인코딩으로 추측해 한글이 깨짐)
  # Boot 4 부터 server.servlet.encoding → spring.servlet.encoding 으로 이름이 바뀜
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/justinneed}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID}
            # Spring 표준 템플릿 → http://localhost:8080/login/oauth2/code/kakao 로 해석 (.env의 KAKAO_REDIRECT_URI와 동일)
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post   # 카카오 앱에 Client Secret '사용함'이 켜져 있어 secret 전송 필요
            # scope 미요청: 가입 시 닉네임은 사용자가 직접 입력(방법 B)하므로 카카오 id(providerId)만 있으면 됨.
            # (profile_nickname 등을 요청하려면 카카오 콘솔의 동의항목을 먼저 활성화해야 함 → KOE205 원인)
          naver:
            client-name: Naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  servlet:
    context-path: /

# 애플리케이션 커스텀 설정 (JWT / OAuth 성공 리다이렉트)
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-please-change-in-prod-0123456789abcdef}
    access-token-validity-seconds: 3600        # 1시간
    refresh-token-validity-seconds: 1209600    # 14일
  oauth:
    success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth/callback}
    # 소셜 로그인 실패 시 돌려보낼 FE 로그인 페이지 (FE 콜백이 쓰는 ?error=oauth 규약과 동일)
    failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT_URI:http://localhost:3000/login?error=oauth}
  cors:
    # 쉼표로 여러 origin 지정 가능 (예: http://localhost:3000,https://app.example.com)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # 크롬 확장 출처 (확장 background 요청의 Origin). allowed-origins 와 합쳐 허용 — 운영 env 를 안 고쳐도 배포만으로 적용된다
    # ID 는 확장 manifest 의 key 로 고정한 값 (비밀값 아님). 쉼표로 여러 개
    extension-origins: ${CORS_EXTENSION_ORIGINS:chrome-extension://pgmclbgdbaiigahdhpnieemifhgoikpa}
  # AI 분석 컨테이너. Spring → AI 분석 알림, AI → Spring 입력 조회 · 결과 콜백(/internal/ai/**) 모두 같은 내부 토큰을 쓴다
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:dev-only-ai-internal-token}
    # AI 는 접수만 하고 바로 202 를 돌려주므로 짧게 둔다 (분석 결과는 콜백으로 온다)
    connect-timeout: 3s
    read-timeout: 10s
  # 세션 수집 · AI 호출 대기 시간
  collection:
    # 마지막 청크 뒤 이 시간 동안 새 청크가 없으면 끝으로 보고 받은 만큼 합친다 (확장은 시작 · 종료 요청을 보내지 않는다)
    auto-end-after: 1h
    # 분석에 성공한 세션의 청크를 마지막 청크 뒤 이 기간만 남긴다 (확장 재전송 기간 = 다시 온 청크의 내용 비교 기간)
    completed-chunk-retention: 3d
    # /analyze 뒤 GET /input 이 없을 때 재전송까지 기다리는 시간
    resend-first-delay: 1m
    # 재전송에 응답이 없었을 때 다음 재전송까지 기다리는 시간. 이번에도 응답이 없으면 FAILED
    resend-second-delay: 2m
    # AI 가 계속 대기 중이어도 ANALYZING 전환 후 이 시간이 지나면 FAILED
    ai-wait-limit: 30m
    # GET /input 뒤 콜백을 기다리는 시간
    callback-timeout: 30m
    # 복구 스케줄러 주기
    scheduler-enabled: true
    scheduler-interval: 30s
    # 합치지 못할 때(원본 형식 오류 등) 시도하는 횟수. 다 차면 FAILED
    merge-max-attempts: 3
